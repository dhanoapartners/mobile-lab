# Two mobile suites against the live Practice Lab:
# - Playwright device emulation (fast, every push)
# - Appium + WebdriverIO in real Chrome on an Android emulator (slower: about 10 minutes)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulation:
    name: Playwright device emulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: playwright-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-mobile-report
          path: playwright-mobile/playwright-report/
          retention-days: 14

  android:
    name: Appium on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: appium/package-lock.json
      - uses: actions/setup-java@v4 # the Android tools need Java
        with:
          distribution: temurin
          java-version: 17
      - name: Install test dependencies
        working-directory: appium
        run: npm ci && npm run typecheck
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: appium
          script: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: appium-logs
          path: appium/logs/
          retention-days: 14
