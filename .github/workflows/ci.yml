# Mobile Lab CI, against the live Practice Lab and the native demo app:
# - Playwright device emulation (fast, every push)
# - Android emulator: the website in Chrome, then the native app (Appium + UiAutomator2)
# - iOS Simulator on macOS: the native app (Appium + XCUITest)
# Every job saves an Allure report.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulation:
    name: Playwright device emulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: playwright-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-mobile/package-lock.json
      - uses: actions/setup-java@v4 # the Allure CLI runs on Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: '1'
      - name: Allure report
        if: ${{ !cancelled() }}
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: emulation-reports
          path: |
            playwright-mobile/allure-report/
            playwright-mobile/playwright-report/
          retention-days: 14

  android:
    name: Android emulator (website + native app)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # WebdriverIO 10 needs Node 22+
          cache: npm
          cache-dependency-path: appium/package-lock.json
      - uses: actions/setup-java@v4 # the Android tools and the Allure CLI need Java
        with:
          distribution: temurin
          java-version: 17
      - name: Install test dependencies and the demo app
        working-directory: appium
        run: npm ci && npm run typecheck && npm run apps
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: appium
          script: npm run test:web && npm run test:android
      - name: Allure report
        if: ${{ !cancelled() }}
        working-directory: appium
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-reports
          path: |
            appium/allure-report/
            appium/logs/
          retention-days: 14

  ios:
    name: iOS Simulator (native app)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appium/package-lock.json
      - uses: actions/setup-java@v4 # for the Allure CLI
        with:
          distribution: temurin
          java-version: 17
      - name: Install test dependencies and the demo app
        working-directory: appium
        run: npm ci && npm run typecheck && npm run apps
      - name: Pick an iPhone simulator
        run: |
          xcrun simctl list devices available
          # The newest available iPhone and its iOS version.
          read -r name version < <(xcrun simctl list devices available --json | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          best=None
          for rt,devs in d.items():
              m=re.search(r'iOS-(\d+)-(\d+)',rt)
              if not m: continue
              v=(int(m.group(1)),int(m.group(2)))
              for x in devs:
                  if x['name'].startswith('iPhone') and (best is None or v>best[0]): best=(v,x['name'])
          print(best[1].replace(' ','_'), f'{best[0][0]}.{best[0][1]}')")
          echo "IOS_DEVICE=${name//_/ }" >> "$GITHUB_ENV"
          echo "IOS_VERSION=$version" >> "$GITHUB_ENV"
          echo "Using ${name//_/ } on iOS $version"
      - name: Run on the simulator
        working-directory: appium
        run: npm run test:ios
      - name: Allure report
        if: ${{ !cancelled() }}
        working-directory: appium
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-reports
          path: |
            appium/allure-report/
            appium/logs/
          retention-days: 14
